# Pilot on the fixed-target distance ladder (configs/pairs/mmlu_ladder.yaml):
# college_biology as the target, five sources at increasing distance.
# Same questions as the other pilot: (a) does cross-domain few-shot beat zero-shot, and
# (b) do relevant examples shift routing on target-question tokens more than irrelevant ones?
# Here the new question is how both change with the source's distance from the target.
name: ladder_pilot
model_config: configs/models/olmoe.yaml
pairs_config: configs/pairs/mmlu_ladder.yaml
seed: 0
num_shots: 5                  # largest k; each replicate draws this many per domain
shot_counts: [1, 2, 3, 4, 5]  # k values to run (nested: k uses the first k examples)
num_replicates: 3             # independent example sets, each fixed across all questions
num_questions_per_target: 144   # all of college_biology's test questions
conditions: [zero_shot, cross_domain, same_domain, irrelevant]
prompts_dir: data/prompts/ladder
output_dir: results/ladder_pilot
options:
  record_routing: true
  jaccard_per_layer: true
  record_hidden_states: true  # keep each router's input; save per-layer shift vs zero-shot
