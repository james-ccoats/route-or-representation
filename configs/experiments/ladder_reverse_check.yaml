# Reverse check on the fixed-target distance ladder: run the zero-shot prompt with
# few-shot routing forced in on the target-question tokens.
# Metric: fraction of gain recovered = (forced - zero_shot) / (few_shot - zero_shot).
# Reads the prompts built by ladder_pilot.yaml.
name: ladder_reverse_check
model_config: configs/models/olmoe.yaml
pairs_config: configs/pairs/mmlu_ladder.yaml
seed: 0
num_shots: 5                  # largest k; each replicate draws this many per domain
shot_counts: [1, 2, 3, 4, 5]  # k values to run (nested: k uses the first k examples)
num_replicates: 3             # independent example sets, each fixed across all questions
num_questions_per_target: 144
conditions: [zero_shot, cross_domain]
prompts_dir: data/prompts/ladder
output_dir: results/ladder_reverse_check
options:
  force_scope: target_question_tokens
  force_mixing_weights: true             # full routing replay: experts and mixing weights (D1)
  layers: null
