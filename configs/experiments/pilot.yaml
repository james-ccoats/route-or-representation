# Phase 2 pilot: (a) does cross-domain few-shot beat zero-shot, and
# (b) do relevant examples shift routing on target-question tokens more than
# irrelevant ones?
name: pilot
model_config: configs/models/olmoe.yaml
pairs_config: configs/pairs/mmlu_pilot.yaml
seed: 0
num_shots: 5                  # largest k; each replicate draws this many per domain
shot_counts: [1, 2, 3, 4, 5]  # k values to run (nested: k uses the first k examples)
num_replicates: 3             # independent example sets, each fixed across all questions
num_questions_per_target: 100 # placeholder; see design_decisions.md
conditions: [zero_shot, cross_domain, same_domain, irrelevant]
prompts_dir: data/prompts/pilot
output_dir: results/pilot
options:
  record_routing: true        # record top-k routing on target-question tokens
  jaccard_per_layer: true
  record_hidden_states: true  # keep each router's input; save per-layer shift vs zero-shot
